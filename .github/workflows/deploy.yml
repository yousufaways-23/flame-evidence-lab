name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  # Deploy to Cloudflare Workers on every push to main.
  # Required repo secrets (Settings → Secrets and variables → Actions):
  #   CLOUDFLARE_API_TOKEN   — token with Workers Scripts:Edit (+ KV:Edit) permissions
  #   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account id
  #   AI_API_KEY             — AI provider key; synced to the Worker as a secret so it
  #                            is never baked into the bundle or committed to the repo.
  deploy:
    name: Deploy to Cloudflare Workers
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check deploy secrets
        id: secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN not configured — skipping deploy (add repo secrets to enable)."
          fi

      - name: Build OpenNext bundle
        if: steps.secrets.outputs.present == 'true'
        run: npm run cf:build

      - name: Sync AI key to Worker secret
        if: steps.secrets.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          if [ -n "$AI_API_KEY" ]; then
            echo "AI_API_KEY=$AI_API_KEY" | npx wrangler secret put AI_API_KEY
          else
            echo "AI_API_KEY not configured — the copilot will run in deterministic mode."
          fi

      - name: Deploy
        if: steps.secrets.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
